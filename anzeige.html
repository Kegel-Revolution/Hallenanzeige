<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Hallenanzeige</title>
<!--
  Hallenanzeige – die Bildschirme in der Halle (Ersatz für den ahlbrowser).

  Vollbild-Anzeige für Zuschauer: läuft im Browser (F11 bzw. Kiosk-Modus)
  direkt gegen die Bridge auf demselben Rechner oder im LAN. Aufbau wie der
  Pausen-Screen des Livestream-Overlays (Navy/Gold, Oswald + Source Sans 3),
  damit Halle und Stream dasselbe Bild sprechen.

  Oben stehen dauerhaft Heim (links) und Gast (rechts) mit dem Gesamtholz
  in Groß und den Mannschaftspunkten in der Mitte. Darunter wechseln sich
  zwei Tafeln ab:
    AUFSTELLUNG   alle Paarungen mit den Satzergebnissen und Satzpunkten
    STATISTIK     Team-Vergleich (Volle, Abräumen, Fehlwürfe, Neuner, ...)

  Parameter (an die Adresse anhängen):
    ?ansicht=aufstellung|statistik     eine Tafel fest einstellen
    ?ansicht=auto                      automatischer Wechsel (Vorgabe)
    ?duellesek=180                     Standzeit der Duelle in Sekunden
    ?statistiksek=20                   Standzeit der Team-Statistik
    ?wechselsek=30                     beide Tafeln gleich lang
    ?heim=2563BC&gast=D8232E           Teamfarben fest vorgeben (Hex ohne #)
    ?overlay=192.168.1.60:4750         Teamfarben vom Stream-Rechner holen,
                                       damit Halle und Stream gleich aussehen
    ?quelle=192.168.1.50:8080          Bridge auf einem anderen Rechner
                                       (nötig, wenn die Datei lokal liegt)

  Farben werden in dieser Reihenfolge bestimmt: ?heim/?gast (fest) vor dem
  Stream-Overlay (?overlay=) vor der Vereinsliste unten im Skript vor der
  Vorgabe. Ist der Stream-Rechner aus, bleibt die Halle also trotzdem
  richtig eingefärbt.
  Tasten: 1 = Aufstellung fest, 2 = Statistik fest, 0 = Automatik,
  F = Vollbild.
-->
<style>
  /* Schriften wie im Stream-Overlay. Relative Pfade, damit dieselbe Datei
     überall läuft: eingebettet in der Bridge (/anzeige), aus einem eigenen
     Ordner (cc2bridge.exe -web …) oder direkt von der Festplatte. */
  @font-face {
    font-family: 'Oswald';
    src: url('fonts/oswald.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: 'Source Sans 3';
    src: url('fonts/source-sans-3.woff2') format('woff2');
    font-weight: 400 700; font-style: normal; font-display: swap;
  }

  :root {
    /* Farbwelt des Stream-Overlays */
    --navy: #0A1733;
    --gold: #E8B21A;
    --rot: #E5202B;
    --blau1: #C7D2E8;   /* helle Zeilen */
    --blau2: #9FB0CE;   /* Beschriftungen */
    --blau3: #8FA2C4;   /* Nebenwerte */
    --blau4: #7183A6;   /* gedämpft (kommende Duelle) */
    --blau5: #5B6E93;   /* Doppelpunkte */
    --linie: rgba(255, 255, 255, .08);
    /* Teamfarben – per ?heim=/?gast= übersteuerbar */
    --heim: #2563BC; --heim-dunkel: #163E77;
    --gast: #D8232E; --gast-dunkel: #82151C;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #060D1D;
    font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
    color: #FFFFFF;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    cursor: none;
  }
  [hidden] { display: none !important; }

  /* Feste 1920×1080-Bühne, auf die Fenstergröße skaliert –
     dadurch sieht die Anzeige auf jedem der Bildschirme gleich aus. */
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 1920px; height: 1080px;
    transform: translate(-50%, -50%);
    overflow: hidden;
    /* "Board"-Look der Vollbild-Screens im Stream-Overlay */
    background:
      repeating-linear-gradient(115deg,
        rgba(255, 255, 255, .025) 0px, rgba(255, 255, 255, .025) 2px,
        transparent 2px, transparent 110px),
      linear-gradient(160deg, #12295A 0%, #081226 62%, #060D1D 100%);
  }

  /* ================================================================
     Oberste Zeile: Liga links, Uhr + Status rechts
     ================================================================ */

  #kopf {
    position: absolute;
    left: 48px; right: 48px; top: 36px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #liga {
    background: rgba(8, 17, 40, .88);
    padding: 10px 18px;
    font-weight: 600;
    font-size: 21px;
    letter-spacing: .07em;
    color: var(--blau1);
    max-width: 660px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #liga:empty { visibility: hidden; }

  #kopf-rechts { display: flex; align-items: center; gap: 14px; }

  /* Groß genug, um sie von der Bahn aus zu lesen */
  #uhr {
    background: rgba(8, 17, 40, .88);
    padding: 8px 22px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: .08em;
    color: var(--blau1);
  }

  /* ================================================================
     Kopf wie beim Pausen-Screen: Heim links, Gast rechts, dazwischen
     die Mannschaftspunkte – Gesamtholz groß unter den Teamnamen.
     ================================================================ */

  #score {
    position: absolute;
    left: 48px; right: 48px; top: 116px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    column-gap: 40px;
  }

  .team { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .team--heim { align-items: flex-start; text-align: left; }
  .team--gast { align-items: flex-end; text-align: right; }

  .team__name {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 46px;
    line-height: 1.1;
    letter-spacing: .04em;
    text-transform: uppercase;
    max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Farbbalken in der Teamfarbe – dieselbe Kennung wie die Statistik-Balken */
  .team__balken { width: 130px; height: 7px; }
  .team--heim .team__balken { background: linear-gradient(90deg, var(--heim), var(--heim-dunkel)); }
  .team--gast .team__balken { background: linear-gradient(90deg, var(--gast-dunkel), var(--gast)); }

  .team__holz {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 132px;
    line-height: 1;
    margin-top: 6px;
  }
  .team__holz.vorn { color: var(--gold); }

  .team__label {
    font-weight: 600;
    font-size: 17px;
    letter-spacing: .14em;
    color: var(--blau2);
  }

  .mitte {
    display: flex; flex-direction: column;
    align-items: center;
    gap: 8px;
    padding-top: 4px;
  }

  #mp {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 140px;
    line-height: 1;
    white-space: nowrap;
  }
  #mp .doppel { color: var(--blau5); font-size: 100px; }

  .mitte__label {
    font-weight: 600;
    font-size: 16px;
    letter-spacing: .14em;
    color: var(--blau2);
  }

  /* Zwei kurze Zeilen statt einer breiten – die Teamnamen links und
     rechts brauchen die Breite. Die Satzpunkte deutlich lesbar, darunter
     kleiner der aktuelle Durchgang/Satz. */
  .unterzeile {
    font-weight: 600;
    letter-spacing: .08em;
    white-space: nowrap;
    text-align: center;
  }
  #uz-sp { margin-top: 12px; font-size: 30px; color: #FFFFFF; }
  #uz-stand { margin-top: 2px; font-size: 22px; color: var(--blau1); }

  /* ================================================================
     Tafeln (wechseln sich ab wie 1F/1G im Stream)
     ================================================================ */

  #tafeln {
    position: absolute;
    left: 48px; right: 48px; top: 400px; bottom: 90px;
    display: flex;
  }

  .tafel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    justify-content: center;
  }
  /* Nur eine Bewegung, keine opacity-Einblendung: steht die Animations-Uhr
     des Browsers still, bliebe die Tafel sonst unsichtbar. */
  .tafel--in { animation: tafel-in .5s cubic-bezier(.2, .7, .25, 1) both; }
  @keyframes tafel-in { from { transform: translateY(26px); } to { transform: none; } }

  .tafel__mitte { max-width: 1560px; width: 100%; margin: 0 auto; }
  /* Die Duell-Zeile trägt Sätze, Holz und Satzpunkte – sie braucht die
     volle Breite, damit die Namen nicht abgeschnitten werden */
  #tafel-duelle .tafel__mitte { max-width: 1824px; }

  .tafel__lbl {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: .1em;
    color: var(--gold);
    margin-bottom: 18px;
  }

  /* ---------- Tafel AUFSTELLUNG: Paarungen mit Satzergebnissen ---------- */

  .du__tabelle { display: flex; flex-direction: column; border-bottom: 1px solid var(--linie); }

  /* Eine Zeile je Paarung, spiegelbildlich um die Satzpunkte in der Mitte:
     Name | Satz 1 2 3 4 | Gesamtholz | SP : SP | Gesamtholz | Satz 4 3 2 1 | Name */
  .du__zeile {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 9px 24px;
    background: rgba(255, 255, 255, .03);
    border-top: 1px solid var(--linie);
  }
  .du__zeile:nth-child(odd) { background: rgba(255, 255, 255, .05); }

  /* Der Name steht am AUSSENRAND der Zeile, deutlich abgesetzt von den
     Satzzahlen – vorher klebte er daran, und aus zehn Metern war nicht zu
     erkennen, wo der Name aufhört und die Zahlen anfangen. Farbe braucht
     er dafür keine: Wer gewonnen hat, steht schon an den ausgefüllten
     Satzfeldern und den Satzpunkten daneben. Der Sieger ist hier nur
     weiß und fett. */
  .du__name {
    font-family: 'Oswald', sans-serif;
    font-size: 44px;
    line-height: 1.15;
    color: #B8C6E0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 5px 10px;
    max-width: 100%;
  }
  .du__name--heim {
    justify-self: start;
    text-align: left;
    margin-right: 16px;
  }
  .du__name--gast {
    justify-self: end;
    text-align: right;
    margin-left: 16px;
  }
  .du__name.laeuft { color: #FFFFFF; }
  .du__name.sieger { color: #FFFFFF; font-weight: 600; }

  /* Gesamtholz des Spielers vor den Satzpunkten – Führender in Gold */
  .du__holz {
    min-width: 92px;
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-size: 38px;
    line-height: 1.1;
    color: #FFFFFF;
    white-space: nowrap;
  }
  .du__holz--heim { margin-left: 6px; }
  .du__holz--gast { margin-right: 6px; }
  .du__holz.gold { color: var(--gold); font-weight: 600; }

  .du__mitte {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .du__satz {
    width: 74px;
    text-align: center;
    padding: 8px 0;
    background: rgba(255, 255, 255, .05);
    font-family: 'Oswald', sans-serif;
    font-size: 34px;
    line-height: 1.2;
    color: #93A5C6;
    white-space: nowrap;
  }
  /* Gewonnener Satz: ausgefüllt in der Teamfarbe. Gold heißt "läuft
     gerade" – zwei Bedeutungen, zwei Farben, damit nichts durcheinander
     geht. */
  .du__satz--sieg { color: #FFFFFF; font-weight: 700; }
  .du__satz--sieg.du__satz--heim { background: var(--heim); }
  .du__satz--sieg.du__satz--gast { background: var(--gast); }
  .du__satz--leer { background: rgba(255, 255, 255, .025); color: rgba(255, 255, 255, .14); }
  .du__satz--live { background: rgba(232, 178, 26, .16); color: var(--gold); }

  /* Satzpunkte des Duells – die Mitte der Zeile. Hier steht bewusst KEIN
     Kasten: Zwischen den beiden Satz-Reihen wirkte ein weiterer gefüllter
     Block wie ein Fremdkörper. Es reicht, dass die führende Zahl weiß und
     fett steht und die andere zurücktritt. */
  .du__sp {
    width: 108px;
    margin: 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    white-space: nowrap;
  }
  .du__spz {
    min-width: 38px;
    text-align: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 36px;
    line-height: 1.2;
    color: var(--blau4);
  }
  .du__spz--heim, .du__spz--gast { color: #FFFFFF; }
  .du__sptr { font-style: normal; font-weight: 400; font-size: 26px; color: var(--blau5); }
  .du__spdg {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 21px;
    color: var(--blau4);
    padding: 4px 0;
  }
  /* Laufendes Duell: die Satzpunkte stehen in Gold – derselbe Sinn wie
     beim laufenden Satz. */
  .du__sp--live .du__spz { color: rgba(232, 178, 26, .55); }
  .du__sp--live .du__spz--heim,
  .du__sp--live .du__spz--gast { color: var(--gold); }
  .du__zeile--kommend .du__name { color: var(--blau4); font-weight: 400; }

  .tafel__fuss { margin-top: 14px; font-size: 18px; color: var(--blau4); }

  /* ---------- Tafel STATISTIK (Stil des Pausen-Screens 1G) ----------
     Ohne Team-Kästen: Wer links und rechts ist, steht schon groß im
     Kopf – die Balkenfarben entsprechen den Farbbalken dort. */

  .st__zeilen { display: flex; flex-direction: column; gap: 20px; }
  .st__zeile { display: flex; align-items: center; gap: 26px; }

  /* Diese Tafel steht allein im Bild und hat Platz im Ueberfluss –
     die Zahlen duerfen also so gross sein, dass man sie aus der letzten
     Reihe lesen kann. */
  .st__wert {
    width: 190px;
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 50px;
    line-height: 1.1;
  }
  .st__wert--gast { text-align: right; }
  .st__wert.gold { color: var(--gold); }

  .st__balken { flex: 1; height: 18px; background: rgba(255, 255, 255, .1); }
  .st__balken--heim { display: flex; justify-content: flex-end; }
  .st__balken i {
    display: block; height: 18px; width: 0;
    transition: width .45s cubic-bezier(.2, .7, .25, 1);
  }
  .st__balken--heim i { background: linear-gradient(90deg, var(--heim-dunkel), var(--heim)); }
  .st__balken--gast i { background: linear-gradient(90deg, var(--gast), var(--gast-dunkel)); }

  .st__label {
    width: 430px;
    text-align: center;
    font-weight: 700; font-size: 30px;
    letter-spacing: .07em;
    color: var(--blau1);
  }

  /* ---------- Hinweis, wenn (noch) kein Wettkampf läuft ---------- */

  #leer {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    text-align: center;
  }
  #leer .gross {
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 64px;
    letter-spacing: .04em;
  }
  #leer .klein { font-size: 26px; color: var(--blau2); }

  /* ================================================================
     Fußzeile: Tafel-Fortschritt + Wettkampf-Info
     ================================================================ */

  #fuss {
    position: absolute;
    left: 48px; right: 48px; bottom: 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
  }
  #wk-info {
    font-size: 17px; color: var(--blau4);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #stand { font-size: 17px; color: var(--blau4); white-space: nowrap; }

  /* Tafel-Wechsel: Countdown zur nächsten Tafel + Fortschritts-Striche
     wie beim Pausen-Screen des Streams */
  #wechsel { display: flex; align-items: center; gap: 18px; }

  #wechsel-text {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 23px;
    letter-spacing: .09em;
    color: var(--blau2);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #wechsel-text:empty { display: none; }
  #wechsel-text b { color: var(--gold); font-weight: 600; }

  #punkte { display: flex; gap: 8px; }
  #punkte .dot { width: 130px; height: 6px; background: rgba(255, 255, 255, .18); }
  #punkte .dot i {
    display: block; width: 0; height: 6px;
    background: var(--gold);
    transition: width .2s linear;
  }

  /* ---------- Verbindungs-Warnung ---------- */

  #warnung {
    position: absolute;
    left: 0; right: 0; top: 0;
    background: var(--rot);
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    padding: 12px 0;
    font-family: 'Oswald', sans-serif;
    font-weight: 600; font-size: 26px;
    letter-spacing: .1em;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .5);
  }
  #warnung i {
    width: 12px; height: 12px; border-radius: 50%;
    background: #FFFFFF;
    animation: blink .9s steps(1, end) infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }
</style>
</head>
<body>
<div id="stage">
  <header id="kopf">
    <div id="liga"></div>
    <div id="kopf-rechts">
      <div id="uhr">--:--</div>
    </div>
  </header>

  <div id="score">
    <div class="team team--heim">
      <span class="team__name" id="name-heim">–</span>
      <i class="team__balken"></i>
      <span class="team__holz" id="holz-heim">0</span>
      <span class="team__label">GESAMTHOLZ</span>
    </div>
    <div class="mitte">
      <span id="mp"><span id="mp-heim">0</span><span class="doppel"> : </span><span id="mp-gast">0</span></span>
      <span class="mitte__label">MANNSCHAFTSPUNKTE</span>
      <span class="unterzeile" id="uz-sp"></span>
      <span class="unterzeile" id="uz-stand"></span>
    </div>
    <div class="team team--gast">
      <span class="team__name" id="name-gast">–</span>
      <i class="team__balken"></i>
      <span class="team__holz" id="holz-gast">0</span>
      <span class="team__label">GESAMTHOLZ</span>
    </div>
  </div>

  <main id="tafeln">
    <section class="tafel" id="tafel-duelle" hidden>
      <div class="tafel__mitte">
        <div class="tafel__lbl" id="duelle-lbl">DIE DUELLE</div>
        <div class="du__tabelle" id="duelle"></div>
        <div class="tafel__fuss" id="duelle-fuss">Duellgewinn = 1 MP &middot; besseres Gesamtholz = 2 MP</div>
      </div>
    </section>

    <section class="tafel" id="tafel-statistik" hidden>
      <div class="tafel__mitte">
        <div class="tafel__lbl">TEAM-STATISTIK</div>
        <div class="st__zeilen" id="statistik"></div>
      </div>
    </section>

    <section class="tafel" id="leer" hidden>
      <div class="gross">KEIN WETTKAMPF AKTIV</div>
      <div class="klein">Die Anzeige startet von selbst, sobald in CC2 ein Wettkampf angelegt ist.</div>
    </section>
  </main>

  <footer id="fuss">
    <span id="wk-info"></span>
    <div id="wechsel">
      <span id="wechsel-text"></span>
      <div id="punkte"></div>
    </div>
    <span id="stand"></span>
  </footer>

  <div id="warnung" hidden><i></i><span>KEINE VERBINDUNG ZUM BAHN-RECHNER &ndash; LETZTER STAND WIRD ANGEZEIGT</span></div>
</div>

<script>
'use strict';

/* ---------------------------------------------------------- Parameter */

const P = new URLSearchParams(location.search);

// Bridge-Adresse: leer = gleiche Herkunft (Normalfall, die Bridge liefert
// diese Seite ja selbst aus). ?quelle=IP:Port, wenn die Datei woanders
// liegt; direkt von der Festplatte geöffnet gilt der Bahn-PC selbst.
const BASIS = P.get('quelle')
  ? 'http://' + P.get('quelle').replace(/^https?:\/\//, '')
  : (location.protocol === 'file:' ? 'http://localhost:8080' : '');

// Standzeit je Tafel (wie "Tafel-Wechsel" beim Pausen-Screen des Streams)
/* Standzeit je Tafel. Die Duelle sind das, wofür die Leute in der Halle
   hinschauen – die stehen drei Minuten, die Team-Statistik zwanzig
   Sekunden. Vorher war beides gleich lang, und die Ergebnisse waren
   gerade dann weg, wenn jemand hinsah. ?wechselsek= setzt weiterhin
   beide gleich, ?duellesek= / ?statistiksek= jede für sich. */
function standzeit(name, vorgabe) {
  const eigen = parseInt(P.get(name) || '', 10);
  if (eigen > 0) return Math.max(5, eigen);
  const beide = parseInt(P.get('wechselsek') || P.get('tafelsek') || '', 10);
  return Math.max(5, beide > 0 ? beide : vorgabe);
}
const DUELLE_SEK = standzeit('duellesek', 180);
const STATISTIK_SEK = standzeit('statistiksek', 20);

/* ---------------------------------------------------------- Teamfarben */

/**
 * Gemerkte Vereinsfarben – dieselbe Liste wie `data/vereine.json` im
 * Stream-Overlay. Beide von Hand synchron halten: Dann zeigt die Halle
 * dieselben Farben wie der Stream, auch wenn der Stream-Rechner gar nicht
 * läuft. Zugeordnet wird über den Vereinsnamen (Teilstring, längster
 * Treffer gewinnt) – genau wie die Wappen im Overlay.
 */
const VEREINE = [
  { name: 'Raindorf', farbe: '#2563BC' }
];

// Vorgabe, wenn ein Verein (noch) nicht in der Liste steht.
const STANDARD = { heim: '#2563BC', gast: '#D8232E' };

/** "2563BC" oder "#2563BC" -> "#2563BC"; alles andere -> "". */
function hexOderLeer(v) {
  const h = String(v || '').trim().replace(/^#/, '');
  return /^[0-9a-fA-F]{6}$/.test(h) ? '#' + h : '';
}

/** Vereinsname auf einen vergleichbaren Schlüssel bringen. */
function vereinsSchluessel(v) {
  return String(v || '')
    .normalize('NFC')
    .toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]/g, '');
}

function farbeVonVerein(name) {
  const key = vereinsSchluessel(name);
  if (!key) return '';
  let treffer = null;
  for (const v of VEREINE) {
    const vk = vereinsSchluessel(v.name);
    if (!vk || !key.includes(vk)) continue;
    if (!treffer || vk.length > vereinsSchluessel(treffer.name).length) treffer = v;
  }
  return treffer ? hexOderLeer(treffer.farbe) : '';
}

// Fest vorgegeben (?heim/?gast) und Adresse des Stream-Rechners (?overlay=)
const FEST = { heim: hexOderLeer(P.get('heim')), gast: hexOderLeer(P.get('gast')) };
const OVERLAY = P.get('overlay')
  ? 'http://' + P.get('overlay').replace(/^[a-z]+:\/\//i, '')
  : '';

let vomOverlay = { heim: '', gast: '' };
let teamNamen = { heim: '', gast: '' };
const farbeJetzt = { heim: '', gast: '' };

/** Farbe setzen; die dunkle Variante für die Verläufe wird mitgerechnet. */
function setzeFarbe(name, hex) {
  const h = hexOderLeer(hex).slice(1);
  if (!h) return;
  const dunkel = [0, 2, 4]
    .map((i) => Math.round(parseInt(h.slice(i, i + 2), 16) * 0.55))
    .map((v) => v.toString(16).padStart(2, '0')).join('');
  document.documentElement.style.setProperty('--' + name, '#' + h);
  document.documentElement.style.setProperty('--' + name + '-dunkel', '#' + dunkel);
}

/** Gültige Farbe je Seite bestimmen und anwenden (nur bei Änderung). */
function farbenAnwenden() {
  for (const seite of ['heim', 'gast']) {
    const farbe = FEST[seite] || vomOverlay[seite] ||
      farbeVonVerein(teamNamen[seite]) || STANDARD[seite];
    if (farbe === farbeJetzt[seite]) continue;
    farbeJetzt[seite] = farbe;
    setzeFarbe(seite, farbe);
  }
}

/**
 * Farben vom Stream-Rechner holen (/api/farben des Overlay-Servers). Der
 * läuft auf einem anderen Rechner und ist nicht immer an – Fehler sind
 * deshalb kein Drama, dann gilt die Vereinsliste.
 */
function holeOverlayFarben() {
  if (!OVERLAY) return;
  fetch(OVERLAY + '/api/farben')
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      if (!d) return;
      vomOverlay = { heim: hexOderLeer(d.heim), gast: hexOderLeer(d.gast) };
      farbenAnwenden();
    })
    .catch(() => {});
}

farbenAnwenden();
if (OVERLAY) {
  holeOverlayFarben();
  setInterval(holeOverlayFarben, 15000);
}

/* ---------------------------------------------------------- Helfer */

const $ = (id) => document.getElementById(id);
const num = (v) => (typeof v === 'number' && isFinite(v) ? v : 0);
const esc = (t) => String(t ?? '').replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]));

/** Satzpunkte-Schreibweise: ganze Zahlen ohne, halbe mit Komma ("4,5"). */
function fmtSp(v) {
  v = num(v);
  return v % 1 === 0 ? String(v) : v.toFixed(1).replace('.', ',');
}

function setText(el, text) {
  if (el.textContent !== String(text)) el.textContent = text;
}

/* ---------------------------------------------------------- Wertung */

/**
 * Sätze je Durchgang. CC2 zählt in anzDurchgaenge jeden Satz einzeln
 * (3 Durchgänge × 4 Sätze = 12). Vier Sätze sind der Normalfall,
 * bei nicht durch 4 teilbaren Werten sind es zwei.
 */
function saetzeJeDurchgang(s) {
  const anz = num((s.wettkampf || {}).anzDurchgaenge);
  if (anz > 0 && anz % 4 !== 0 && anz % 2 === 0) return 2;
  return 4;
}

/**
 * Mannschaftspunkte wie in der Score-Leiste des Streams: je begonnenem
 * Duell 1 Punkt für den Führenden (mehr Satzpunkte, bei Gleichstand mehr
 * Holz, sonst je 0,5) + 2 Punkte für die Führung im Gesamtholz (bei
 * Gleichstand je 1). Nach Spielende gilt die Rechnung der Bridge.
 */
function mannschaftspunkte(s) {
  const teams = s.teams || [];
  if (s.matchFertig && teams.length === 2) {
    const h = num(teams[0].mannschaftspunkte);
    const g = num(teams[1].mannschaftspunkte);
    if (h + g > 0) return { heim: h, gast: g };
  }
  let heim = 0;
  let gast = 0;
  for (const d of s.duelle || []) {
    const spH = num(d.satzpunkteHeim);
    const spG = num(d.satzpunkteGast);
    const hH = num(d.holzHeim);
    const hG = num(d.holzGast);
    if (spH + spG === 0 && hH === 0 && hG === 0) continue;
    if (spH > spG) heim += 1;
    else if (spG > spH) gast += 1;
    else if (hH > hG) heim += 1;
    else if (hG > hH) gast += 1;
    else { heim += 0.5; gast += 0.5; }
  }
  const gh = num(teams[0] && teams[0].gesamt);
  const gg = num(teams[1] && teams[1].gesamt);
  if (gh > gg) heim += 2;
  else if (gg > gh) gast += 2;
  else if (gh > 0) { heim += 1; gast += 1; }
  return { heim, gast };
}

/**
 * Abräum-Würfe eines Spielers: jeder Satz besteht aus je einer Hälfte
 * Volle und Abräumen – aus der Gesamtwurfzahl exakt ableitbar
 * (dieselbe Rechnung wie im Stream-Overlay).
 */
function abraeumWuerfe(wurf, maxWurf) {
  const max = maxWurf > 0 ? maxWurf : 30;
  const haelfte = Math.floor(max / 2);
  return Math.floor(wurf / max) * haelfte + Math.max(0, (wurf % max) - haelfte);
}

/** Kennzahlen beider Teams für die Statistik-Tafel (wie 1G im Stream). */
function kennzahlen(s) {
  const teams = s.teams || [];
  const maxWurf = num(((s.bahnen || [])[0] || {}).maxWurf) || 30;
  // Gespielte Sätze = Summe der vergebenen Satzpunkte (je Satz genau einer)
  const saetze = (s.duelle || []).reduce(
    (sum, d) => sum + num(d.satzpunkteHeim) + num(d.satzpunkteGast), 0);
  const werte = (t) => {
    if (!t) t = {};
    const abraeumen = num(t.abraeumen);
    const abrWuerfe = (t.spieler || []).reduce(
      (sum, p) => sum + (p.dabei ? abraeumWuerfe(num(p.wurf), maxWurf) : 0), 0);
    const bilder = abraeumen / 9; // ein Abräumbild sind 9 Kegel
    return {
      volle: num(t.volle),
      abraeumen,
      fehl: num(t.fehlwuerfe),
      neuner: num(t.neunen),
      abrBild: bilder > 0 && abrWuerfe > 0 ? abrWuerfe / bilder : NaN,
      satzpunkte: num(t.satzpunkte),
      holzProSatz: saetze > 0 ? num(t.gesamt) / saetze : NaN
    };
  };
  return { heim: werte(teams[0]), gast: werte(teams[1]) };
}

/* ---------------------------------------------------------- Tafel AUFSTELLUNG */

/**
 * Laufende Sätze je Platz von den Bahnen ablesen: solange ein Satz noch
 * nicht abgeschlossen (und damit noch nicht in saetzeHeim/saetzeGast
 * verbucht) ist, kommt sein Zwischenstand aus bahnen[].holzImSatzPlatz.
 */
function laufendeSaetze(s) {
  const map = {};
  for (const b of s.bahnen || []) {
    if (!b.letzterWurf && !b.spieler) continue;
    const pos = num(b.platzPos);
    if (!pos) continue;
    if (!map[pos]) map[pos] = {};
    map[pos][b.teamIdx === 1 ? 'gast' : 'heim'] = {
      satz: num(b.satz),
      wert: num(b.holzImSatzPlatz) || num(b.holzImSatz)
    };
  }
  return map;
}

function renderDuelle(s) {
  const sjd = saetzeJeDurchgang(s);
  const teams = s.teams || [];

  // Alle Plätze des Spiels: gespielte und laufende kommen aus duelle[],
  // noch nicht begonnene aus der Aufstellung (Startpositionen der Teams) –
  // so stehen auch die kommenden Durchgänge und vor dem ersten Wurf die
  // komplette Startaufstellung im Bild.
  const proPos = {};
  for (const d of s.duelle || []) proPos[num(d.pos)] = d;
  const dgs = Math.min(3, Math.max(1,
    Math.round(num((s.wettkampf || {}).anzDurchgaenge) / sjd) || 3));
  const plaetze = Math.max(dgs * 2, ...Object.keys(proPos).map(Number));
  const nameAufPos = (team, pos) => {
    for (const p of (team && team.spieler) || []) {
      if (num(p.pos) === pos) return p.name || '';
    }
    return '';
  };
  const duelle = [];
  for (let pos = 1; pos <= plaetze; pos++) {
    if (proPos[pos]) { duelle.push(proPos[pos]); continue; }
    const heim = nameAufPos(teams[0], pos);
    const gast = nameAufPos(teams[1], pos);
    if (heim || gast) duelle.push({ pos, heim, gast });
  }

  const vorSpiel = num(s.wurfAnzahl) === 0;
  setText($('duelle-lbl'), vorSpiel ? 'STARTAUFSTELLUNG' : (s.matchFertig ? 'ENDSTAND — DIE DUELLE' : 'DIE DUELLE'));
  $('duelle-fuss').textContent = vorSpiel
    ? 'Noch kein Wurf – die Anzeige startet von selbst'
    : 'Duellgewinn = 1 MP · besseres Gesamtholz = 2 MP';

  const live = laufendeSaetze(s);

  let html = '';
  for (const d of duelle) {
    const spH = num(d.satzpunkteHeim);
    const spG = num(d.satzpunkteGast);
    const hH = num(d.holzHeim);
    const hG = num(d.holzGast);
    const begonnen = spH + spG > 0 || hH > 0 || hG > 0;
    const fertig = spH + spG >= sjd;

    // Sieger nach Duell-Regel: Satzpunkte entscheiden, dann Holz
    let siegH = false;
    let siegG = false;
    if (fertig) {
      if (spH !== spG) { siegH = spH > spG; siegG = spG > spH; }
      else if (hH !== hG) { siegH = hH > hG; siegG = hG > hH; }
    }

    // Satz für Satz je Seite: abgeschlossene Sätze aus dem Duell, der
    // laufende von den Bahnen (goldenes Feld, zählt live mit), der Rest
    // bleibt leer. Sieger eines Satzes hell.
    const saetzeH = Array.isArray(d.saetzeHeim) ? d.saetzeHeim : [];
    const saetzeG = Array.isArray(d.saetzeGast) ? d.saetzeGast : [];
    const lv = live[num(d.pos)] || {};
    const zelle = (eigen, gegner, laufend, i, seite) => {
      const gebucht = i < eigen.length;
      const wert = gebucht ? num(eigen[i])
        : (laufend && laufend.satz === i + 1 ? laufend.wert : null);
      if (wert === null) return '<span class="du__satz du__satz--leer">–</span>';
      let kl = 'du__satz du__satz--' + seite;
      if (!(gebucht && i < gegner.length)) kl += ' du__satz--live';
      else if (num(eigen[i]) > num(gegner[i])) kl += ' du__satz--sieg';
      return '<span class="' + kl + '">' + wert + '</span>';
    };
    let heimSaetze = '';
    let gastSaetze = '';
    for (let i = 0; i < sjd; i++) heimSaetze += zelle(saetzeH, saetzeG, lv.heim, i, 'heim');
    // Gast gespiegelt: Satz 4, 3, 2, 1 – wie im Spiegelbild der Heimseite
    for (let i = sjd - 1; i >= 0; i--) gastSaetze += zelle(saetzeG, saetzeH, lv.gast, i, 'gast');

    const dg = Math.ceil(num(d.pos) / 2) || 1;
    let sp;
    let spKl = 'du__sp';
    if (fertig || begonnen) {
      if (!fertig) spKl += ' du__sp--live';
      sp = '<b class="du__spz' + (spH > spG ? ' du__spz--heim' : '') + '">' + fmtSp(spH) + '</b>' +
           '<i class="du__sptr">:</i>' +
           '<b class="du__spz' + (spG > spH ? ' du__spz--gast' : '') + '">' + fmtSp(spG) + '</b>';
    } else {
      sp = '<span class="du__spdg">' + dg + '. DG</span>';
    }

    const zeileKl = 'du__zeile' + (begonnen ? '' : ' du__zeile--kommend');
    const wechsel = d.gewechselt ? ' <span style="color:var(--gold)">&#8644;</span>' : '';
    html +=
      '<div class="' + zeileKl + '">' +
      '<span class="du__name du__name--heim' + (siegH ? ' sieger' : begonnen && !fertig ? ' laeuft' : '') + '">' + esc(d.heim || '–') + wechsel + '</span>' +
      '<span class="du__mitte">' +
      heimSaetze +
      '<span class="du__holz du__holz--heim' + ((fertig ? siegH : begonnen && hH > hG) ? ' gold' : '') + '">' + (begonnen ? hH : '') + '</span>' +
      '<span class="' + spKl + '">' + sp + '</span>' +
      '<span class="du__holz du__holz--gast' + ((fertig ? siegG : begonnen && hG > hH) ? ' gold' : '') + '">' + (begonnen ? hG : '') + '</span>' +
      gastSaetze +
      '</span>' +
      '<span class="du__name du__name--gast' + (siegG ? ' sieger' : begonnen && !fertig ? ' laeuft' : '') + '">' + esc(d.gast || '–') + wechsel + '</span>' +
      '</div>';
  }
  $('duelle').innerHTML = html;
}

/* ---------------------------------------------------------- Tafel STATISTIK */

const STAT_ZEILEN = [
  { key: 'volle', label: 'VOLLE' },
  { key: 'abraeumen', label: 'ABRÄUMEN' },
  { key: 'fehl', label: 'FEHLWÜRFE', kleinerBesser: true },
  { key: 'neuner', label: 'NEUNER' },
  { key: 'abrBild', label: 'Ø WÜRFE PRO ABRÄUMBILD', kleinerBesser: true, dezimal: 1 },
  { key: 'satzpunkte', label: 'SATZPUNKTE', halb: true },
  { key: 'holzProSatz', label: 'Ø HOLZ PRO SATZ', dezimal: 1 }
];

// Die Zeilen stehen fest – einmal bauen reicht
const statRefs = [];
for (const zeile of STAT_ZEILEN) {
  const el = document.createElement('div');
  el.className = 'st__zeile';
  el.innerHTML =
    '<span class="st__wert" data-el="heimWert">–</span>' +
    '<div class="st__balken st__balken--heim"><i data-el="heimBalken"></i></div>' +
    '<span class="st__label">' + zeile.label + '</span>' +
    '<div class="st__balken st__balken--gast"><i data-el="gastBalken"></i></div>' +
    '<span class="st__wert st__wert--gast" data-el="gastWert">–</span>';
  $('statistik').appendChild(el);
  const q = (name) => el.querySelector('[data-el="' + name + '"]');
  statRefs.push({
    zeile,
    heimWert: q('heimWert'), gastWert: q('gastWert'),
    heimBalken: q('heimBalken'), gastBalken: q('gastBalken')
  });
}

function fmtStat(v, zeile) {
  if (!isFinite(v)) return '–';
  if (zeile.halb) return fmtSp(Math.round(v * 2) / 2);
  if (!zeile.dezimal) return String(Math.round(v));
  return v.toFixed(zeile.dezimal).replace('.', ',');
}

function renderStatistik(s) {
  const kz = kennzahlen(s);
  for (const r of statRefs) {
    const h = kz.heim[r.zeile.key];
    const g = kz.gast[r.zeile.key];
    setText(r.heimWert, fmtStat(h, r.zeile));
    setText(r.gastWert, fmtStat(g, r.zeile));
    const max = Math.max(isFinite(h) ? h : 0, isFinite(g) ? g : 0);
    r.heimBalken.style.width = max > 0 && isFinite(h) ? (100 * h / max) + '%' : '0';
    r.gastBalken.style.width = max > 0 && isFinite(g) ? (100 * g / max) + '%' : '0';
    // Gold für den besseren Wert (bei Fehlwürfen usw. den kleineren)
    let besserH = false;
    let besserG = false;
    if (isFinite(h) && isFinite(g) && h !== g) {
      besserH = r.zeile.kleinerBesser ? h < g : h > g;
      besserG = !besserH;
    }
    r.heimWert.classList.toggle('gold', besserH);
    r.gastWert.classList.toggle('gold', besserG);
  }
}

/* ---------------------------------------------------------- Kopf */

function renderKopf(s) {
  const teams = s.teams || [];
  const wk = s.wettkampf || {};
  setText($('name-heim'), (teams[0] && teams[0].name) || '–');
  setText($('name-gast'), (teams[1] && teams[1].name) || '–');

  const mp = mannschaftspunkte(s);
  setText($('mp-heim'), fmtSp(mp.heim));
  setText($('mp-gast'), fmtSp(mp.gast));

  const gh = num(teams[0] && teams[0].gesamt);
  const gg = num(teams[1] && teams[1].gesamt);
  setText($('holz-heim'), gh);
  setText($('holz-gast'), gg);
  $('holz-heim').classList.toggle('vorn', gh > gg);
  $('holz-gast').classList.toggle('vorn', gg > gh);

  // Zwei kurze Zeilen unter den Mannschaftspunkten: Satzpunkte + Spielstand
  const sjd = saetzeJeDurchgang(s);
  const uzSp = $('uz-sp');
  uzSp.hidden = num(s.wurfAnzahl) === 0;
  setText(uzSp, 'SATZPUNKTE ' + fmtSp(teams[0] && teams[0].satzpunkte) +
    ' : ' + fmtSp(teams[1] && teams[1].satzpunkte));

  let stand = '';
  if (s.matchFertig) {
    stand = 'SPIEL BEENDET';
  } else if (num(s.wurfAnzahl) > 0 && num(wk.aktDurchgang) > 0) {
    const dg = Math.max(1, Math.ceil(num(wk.aktDurchgang) / sjd));
    let satz = 0;
    for (const b of s.bahnen || []) if (b.letzterWurf || b.aktiv) satz = Math.max(satz, num(b.satz));
    stand = dg + '. DURCHGANG' + (satz > 0 ? ' · SATZ ' + satz + '/' + sjd : '');
  }
  const uzStand = $('uz-stand');
  uzStand.hidden = !stand;
  setText(uzStand, stand);

  const liga = [wk.liga, wk.spieltag ? wk.spieltag + '. SPIELTAG' : null]
    .filter(Boolean).join(' · ').toUpperCase();
  setText($('liga'), liga || String(wk.bezeichnung || ''));

  const info = [wk.bezeichnung, wk.ort].filter(Boolean).join(' · ');
  setText($('wk-info'), info + (s.demo ? ' · Aufzeichnung' : ''));
  setText($('stand'), s.zeit ? 'Stand ' + s.zeit : '');
}

/**
 * Namen so groß wie möglich – aber immer vollständig.
 *
 * Ausgeschrieben sind die Namen sehr verschieden lang: "Funk Lukas" hat
 * zehn Zeichen, "Pointinger Juergen" achtzehn. Eine Schriftgröße, die für
 * den längsten reicht, verschenkt bei allen anderen die halbe Höhe.
 * Deshalb bekommt jede Zeile die größte Schrift, mit der ihr Name noch in
 * die Spalte passt: Start bei NAME_MAX, herunter in Zweierschritten bis
 * NAME_MIN. Abgeschnitten wird nur, wenn selbst NAME_MIN nicht reicht.
 */
const NAME_MAX = 44;
const NAME_MIN = 24;

function namenEinpassen() {
  for (const el of document.querySelectorAll('.du__name')) {
    let groesse = NAME_MAX;
    el.style.fontSize = groesse + 'px';
    // scrollWidth > clientWidth heißt: der Text ist breiter als das Feld.
    while (groesse > NAME_MIN && el.scrollWidth > el.clientWidth) {
      groesse -= 2;
      el.style.fontSize = groesse + 'px';
    }
  }
}

/* ---------------------------------------------------------- Tafel-Wechsel */

let S = null;             // letzter Spielstand
let ansichtFest = null;   // per Parameter/Taste fest gewählte Tafel
let ablauf = [];          // [['duelle', 20], ['statistik', 20]]
let ablaufPos = 0;
let tafelSeit = Date.now();
let curWk = -1;

const ANSICHTEN = { aufstellung: 'duelle', duelle: 'duelle', statistik: 'statistik' };
const start = P.get('ansicht');
if (start && ANSICHTEN[start]) ansichtFest = ANSICHTEN[start];

/** Welche Tafeln der aktuelle Spielstand hergibt. */
function moeglicheTafeln(s) {
  if (!s) return [];
  const teams = s.teams || [];
  if (!teams[0] || !teams[0].name) return [];               // kein Wettkampf
  if (num(s.wurfAnzahl) === 0) return ['duelle'];           // Startaufstellung
  return ['duelle', 'statistik'];
}

function zeigeTafel(name) {
  for (const t of ['duelle', 'statistik']) {
    const el = $('tafel-' + t);
    const aktiv = t === name;
    if (!el.hidden && aktiv) continue;
    el.hidden = !aktiv;
    if (aktiv) {
      el.classList.remove('tafel--in');
      void el.offsetWidth;
      el.classList.add('tafel--in');
    }
  }
  $('leer').hidden = name !== null && name !== undefined;
}

function renderTafeln() {
  if (!S) return;
  const tafeln = moeglicheTafeln(S);
  if (tafeln.length === 0) { zeigeTafel(null); $('punkte').innerHTML = ''; return; }

  let aktiv;
  if (ansichtFest && tafeln.includes(ansichtFest)) {
    aktiv = ansichtFest;
    $('punkte').innerHTML = '';
    $('wechsel-text').textContent = '';
  } else {
    const neu = tafeln.map((t) => [t, t === 'duelle' ? DUELLE_SEK : STATISTIK_SEK]);
    if (JSON.stringify(neu) !== JSON.stringify(ablauf)) {
      ablauf = neu;
      ablaufPos = 0;
      tafelSeit = Date.now();
    }
    const vergangen = (Date.now() - tafelSeit) / 1000;
    if (vergangen >= ablauf[ablaufPos][1]) {
      ablaufPos = (ablaufPos + 1) % ablauf.length;
      tafelSeit = Date.now();
    }
    aktiv = ablauf[ablaufPos][0];

    // Countdown zur nächsten Tafel + Fortschritts-Striche wie beim
    // Pausen-Screen des Streams – nur wenn wirklich gewechselt wird
    const punkte = $('punkte');
    const wtext = $('wechsel-text');
    if (ablauf.length < 2) {
      punkte.innerHTML = '';
      wtext.textContent = '';
    } else {
      if (punkte.children.length !== ablauf.length) {
        punkte.innerHTML = ablauf.map(() => '<span class="dot"><i></i></span>').join('');
      }
      for (let i = 0; i < ablauf.length; i++) {
        const anteil = i < ablaufPos ? 100 : i > ablaufPos ? 0
          : Math.min(100, 100 * (Date.now() - tafelSeit) / 1000 / ablauf[ablaufPos][1]);
        punkte.children[i].firstElementChild.style.width = anteil + '%';
      }
      const NAMEN = { duelle: 'DIE DUELLE', statistik: 'TEAM-STATISTIK' };
      const naechste = ablauf[(ablaufPos + 1) % ablauf.length][0];
      const rest = Math.max(0, Math.ceil(ablauf[ablaufPos][1] - vergangen));
      // Bei drei Minuten Standzeit ist ein Countdown ab 180 nur Unruhe –
      // die Ansage kommt erst, wenn der Wechsel wirklich bevorsteht.
      wtext.innerHTML = rest > 30 ? ''
        : 'GLEICH: <b>' + NAMEN[naechste] + '</b> &middot; ' + rest + ' s';
    }
  }

  zeigeTafel(aktiv);
  if (aktiv === 'duelle') { renderDuelle(S); namenEinpassen(); }
  else if (aktiv === 'statistik') renderStatistik(S);
}

setInterval(renderTafeln, 250);

document.addEventListener('keydown', (e) => {
  if (e.key === '1') ansichtFest = 'duelle';
  else if (e.key === '2') ansichtFest = 'statistik';
  else if (e.key === '0') ansichtFest = null;
  else if (e.key === 'f' || e.key === 'F') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  } else return;
  renderTafeln();
});

/* ---------------------------------------------------------- Daten */

function render(s) {
  if (!s || typeof s !== 'object') return;
  S = s;

  // Neuer Wettkampf angelegt? Von vorn beginnen.
  const wkId = num((s.wettkampf || {}).id);
  if (wkId !== curWk) {
    curWk = wkId;
    ablaufPos = 0;
    tafelSeit = Date.now();
  }

  // Teamfarben folgen den Mannschaften (Vereinsliste bzw. Stream-Rechner).
  const teams = Array.isArray(s.teams) ? s.teams : [];
  teamNamen = {
    heim: String((teams[0] || {}).name || ''),
    gast: String((teams[1] || {}).name || '')
  };
  farbenAnwenden();

  renderKopf(s);
  renderTafeln();
}

// SSE mit Polling als Rückfallebene; bei Ausfall bleibt der letzte Stand
// stehen und die rote Warnung erscheint (nach kurzer Schonfrist, damit die
// automatische Wiederverbindung keine Fehlalarme produziert).
let warnungAb = 0;
function verbindungOk(ok) {
  if (ok) { warnungAb = 0; $('warnung').hidden = true; return; }
  if (!warnungAb) warnungAb = Date.now() + 6000;
}
setInterval(() => {
  if (warnungAb && Date.now() > warnungAb) $('warnung').hidden = false;
}, 500);

let pollTimer = null;
function starteAbfrage() {
  if (pollTimer) return;
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch(BASIS + '/live.json');
      render(await r.json());
      verbindungOk(true);
    } catch (e) { verbindungOk(false); }
  }, 1500);
}

try {
  const es = new EventSource(BASIS + '/events');
  es.onopen = () => verbindungOk(true);
  es.onmessage = (ev) => {
    try {
      const m = JSON.parse(ev.data);
      if (m.typ === 'snapshot') { render(m.daten); verbindungOk(true); }
    } catch (e) { /* halbe Nachricht – nächste kommt */ }
  };
  es.onerror = () => { verbindungOk(false); starteAbfrage(); };
} catch (e) { starteAbfrage(); }
fetch(BASIS + '/live.json').then((r) => r.json()).then((s) => { render(s); verbindungOk(true); }).catch(() => verbindungOk(false));

/* ---------------------------------------------------------- Bühne + Uhr */

function skaliere() {
  const f = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + f + ')';
}
window.addEventListener('resize', skaliere);
skaliere();

function uhr() {
  const d = new Date();
  setText($('uhr'), String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'));
}
setInterval(uhr, 5000);
uhr();
</script>
